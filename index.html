<!DOCTYPE html>
<html>
<head>
<title>Image Gallery</title>
<style>
*{

box-sizing:border-box;
margin:0;
padding:0;
}
body{
background:white;
font-family:Arial,sans-serif;
}
.gallery{
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,145px);
gap:3px;
width:100%;
max-width:900px;
margin:auto;
}
.gallery img{
width:100%;
height:100%;
object-fit:cover;
border:2px solid #333;
border-radius:5px;
}
.landscape{
grid-column:span 2;
grid-row:span 2;
}
@media(max-width:600px){
.gallery{
grid-template-rows:repeat(4,90px);
gap:2px;
}
}
</style>
</head>
